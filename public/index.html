<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Transfert P2P ultra-sécurisé, direct, chiffré, sans stockage.">
<meta name="theme-color" content="#00b4d8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TransferX">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" type="image/svg+xml" href="/icon-192.svg">
<link rel="manifest" href="/manifest.json">
<title>TransferX — Transfert Sécurisé P2P</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="container">

  <!-- ÉTAPE 1 : SÉLECTION -->
  <section id="step-select" class="step active">
    <header>
      <div class="eyebrow">TRANSFERX / P2P</div>
      <h1>Transfert <span>Sécurisé</span></h1>
      <p>Direct, chiffré, sans stockage serveur.</p>
    </header>

    <div class="mode-choice">
      <button id="btnModeFile" class="btn-mode" type="button">
        <span class="icon">📄</span><span>Envoyer un fichier</span>
      </button>
      <button id="btnModeFolder" class="btn-mode" type="button">
        <span class="icon">📁</span><span>Envoyer un dossier</span>
      </button>
    </div>

    <input type="file" id="fileInput" class="hidden" accept="*/*">
    <input type="file" id="folderInput" class="hidden" webkitdirectory directory multiple>

    <div id="filePreview" class="file-preview hidden"><div id="fileInfo"></div></div>

    <div class="options">
      <label>⏳ Expiration du lien
        <select id="expirySelect">
          <option value="3600000">1 heure</option>
          <option value="21600000">6 heures</option>
          <option value="86400000" selected>24 heures</option>
          <option value="259200000">3 jours</option>
          <option value="604800000">7 jours</option>
        </select>
      </label>
      <label>🔢 PIN optionnel
        <input id="pinInput" inputmode="numeric" maxlength="8" placeholder="4 à 8 chiffres">
      </label>
    </div>

    <button id="btnStartSend" class="btn primary" type="button">🔗 Générer le lien sécurisé</button>
    <div id="errorBox" class="error-box hidden"></div>
  </section>

  <!-- ÉTAPE 2 : LIEN PRÊT -->
  <section id="step-waiting" class="step">
    <div class="eyebrow">LIEN PRÊT</div>
    <h2>Partagez votre lien</h2>

    <div class="link-box">
      <input type="text" id="linkOutput" readonly placeholder="Génération...">
      <button id="btnCopyLink" class="btn secondary" type="button">📋 Copier</button>
    </div>

    <!-- ✅ QR CODE : affiché au moment de la génération -->
    <div id="qrBox" class="qr" aria-label="QR code du lien"></div>
    <p id="pinBadge" class="pin-badge hidden"></p>

    <div class="email-box">
      <input type="email" id="emailInput" placeholder="Envoyer par email (optionnel)">
      <button id="btnSendEmail" class="btn secondary" type="button">✉️ Envoyer</button>
    </div>

    <p id="waitingMsg" class="notice">⏳ En attente du destinataire…</p>
    <button id="btnCancelSend" class="btn danger" type="button">❌ Annuler</button>
    <div id="errorBox2" class="error-box hidden"></div>
  </section>

  <!-- ÉTAPE 3 : TRANSFERT -->
  <section id="step-transfer" class="step">
    <div class="eyebrow">CONNEXION CHIFFRÉE</div>
    <p id="transferTitle">Préparation…</p>
    <div class="progress-container">
      <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
      <div class="progress-stats"><b id="progressText">0 %</b><span id="speedText"></span></div>
    </div>
    <button id="btnCancelTransfer" class="btn danger" type="button">⛔ Arrêter</button>
    <div id="errorBox3" class="error-box hidden"></div>
  </section>

  <!-- ÉTAPE 4 : TERMINÉ -->
  <section id="step-done" class="step">
    <div class="success-icon">✓</div>
    <h2>Transfert terminé</h2>
    <p id="doneSubtitle" class="notice">Votre fichier est prêt.</p>
    <a id="downloadLink" class="btn primary hidden" href="#">⬇️ Télécharger</a>
    <button id="btnRestart" class="btn secondary" type="button">🔄 Nouveau transfert</button>
  </section>

  <footer>🔒 WebRTC · chiffrement de bout en bout · aucun stockage</footer>
</div>

<!-- Seul Socket.IO au démarrage (page légère = pas de mémoire insuffisante) -->
<script defer src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script defer src="/app.js"></script>
</body>
</html>
